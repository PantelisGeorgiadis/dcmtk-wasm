name: WASM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Pin the SDK: newer emsdk (>= 5) fails to link the LTO-built C++ runtime
      # with -fwasm-exceptions, producing undefined operator new/delete and
      # __cxa_* symbols at link time. 4.0.23 is the verified working version.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.23

      - name: Checkout
        uses: actions/checkout@v6
      - name: Make build script executable
        working-directory: ./wasm
        run: chmod +x ./build.sh
      - name: Build
        working-directory: ./wasm
        run: ./build.sh

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcmtk-wasm
          path: wasm/bin/dcmtk-wasm.wasm
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Download WebAssembly artifact
        uses: actions/download-artifact@v4
        with:
          name: dcmtk-wasm
          path: wasm/bin

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
